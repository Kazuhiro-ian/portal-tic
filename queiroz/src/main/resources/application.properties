# Porta HTTP: em produção (Railway) a plataforma injeta a variável PORT dinamicamente;
# localmente, sem essa variável definida, continua caindo em 8080.
server.port=${PORT:8080}

# Configurações de Conexão com o PostgreSQL
# ATENÇÃO: nenhum segredo deve ficar hardcoded aqui. Defina DB_PASSWORD, JWT_SECRET, CREDENCIAL_ENC_KEY
# como variáveis de ambiente do sistema/processo antes de subir a aplicação (não há valor default para
# essas três — a aplicação falha ao iniciar se estiverem ausentes, de propósito).
# DB_HOST/DB_PORT/DB_NAME têm defaults para o Postgres local; em produção são apontados para o
# plugin Postgres do Railway via variáveis de referência (ver guia de deploy).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portal_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate/JPA
# update: cria e atualiza as tabelas automaticamente baseado nas suas classes Java.
# Depois de ativar o Flyway (ver abaixo), troque para "validate": o schema passa a ser
# responsabilidade das migrations e o Hibernate só confere se as entidades batem com ele.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Flyway (controle de versão do schema) — DESLIGADO por padrão de propósito.
# O banco de produção já existe e foi criado pelo Hibernate, então ligar sem preparo faria o
# Flyway tentar rodar a migration inicial sobre tabelas que já existem e a aplicação não subiria.
# O passo a passo de ativação segura está em queiroz/migrations/README.md.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Agrupa INSERT/UPDATE em lote quando possível, e ordena as operações para maximizar o
# agrupamento -- reduz round-trips em gravações com muitas linhas de uma vez.
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Autenticação / JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# Limite de tentativas de login por usuário antes de bloquear temporariamente (força bruta).
auth.rate-limit.max-tentativas=${AUTH_RATE_LIMIT_MAX_TENTATIVAS:5}
auth.rate-limit.bloqueio-minutos=${AUTH_RATE_LIMIT_BLOQUEIO_MINUTOS:15}

# Criptografia em repouso do cofre de credenciais (chave AES-256 em base64, 32 bytes decodificados)
credencial.encryption.key=${CREDENCIAL_ENC_KEY}

# Actuator: expõe apenas o healthcheck, nada de métricas/env/beans (que revelariam configuração
# interna). O "never" em show-details evita detalhar componentes internos a quem chamar sem auth.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Teste de conexão (ping) dos ativos. Só funciona quando a aplicação roda DENTRO da rede da
# empresa, já que os equipamentos têm IP interno. Em produção na Railway deve ser desligado
# (ATIVOS_PING_ENABLED=false): lá o teste falharia sempre e ainda marcaria como "Offline"
# equipamentos que estão perfeitamente no ar.
ativos.ping.enabled=${ATIVOS_PING_ENABLED:true}

# Upload dos relatórios de inventário do Protheus (XML SpreadsheetML — bem mais
# verboso que .xlsx: um relatório real de ~10 mil produtos já chega a uns 15 MB).
# O limite existe pra barrar arquivo claramente errado antes de ocupar memória do
# servidor, não pra restringir o uso normal.
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# CORS - origens permitidas (separadas por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Bootstrap do usuário administrador inicial (só é usado se a tabela de usuários estiver vazia)
admin.bootstrap.username=${ADMIN_BOOTSTRAP_USERNAME:admin}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}