# Perfil usado pela suíte de testes. Existe para que os testes (e a CI) rodem sem exigir um
# PostgreSQL instalado nem as variáveis de ambiente de produção (DB_PASSWORD/JWT_SECRET/etc).
# As propriedades daqui têm precedência sobre as do application.properties principal.

# Banco em memória, recriado do zero a cada execução.
spring.datasource.url=jdbc:h2:mem:portal_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Segredos fictícios: valores sem significado, válidos apenas em formato para o contexto subir.
# O JWT_SECRET real de produção continua vindo de variável de ambiente.
jwt.secret=c2VncmVkby1kZS10ZXN0ZS1hcGVuYXMtbmFvLXVzYXItZW0tcHJvZHVjYW8=
jwt.expiration-ms=3600000

# Não cria o ADMIN inicial durante os testes: cada teste monta os dados de que precisa.
admin.bootstrap.password=senha-de-teste-nao-usada-em-producao

# Flyway fica desligado nos testes: o schema é gerado pelo Hibernate (create-drop) acima.
spring.flyway.enabled=false
